<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建联达人看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f172a; --bg-card: #1e293b; --bg-card-hover: #334155;
            --accent: #6366f1; --accent-light: #818cf8; --accent-pink: #ec4899;
            --text: #f1f5f9; --text-muted: #94a3b8; --border: #334155;
            --shadow: rgba(0,0,0,0.3);
            --tag-life: #10b981; --tag-fashion: #ec4899; --tag-beauty: #a855f7; --tag-business: #f59e0b;
        }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .logo { width: 44px; height: 44px; background: linear-gradient(135deg, var(--accent), var(--accent-pink)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: white; }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header h1 span { color: var(--text-muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .stat-pill { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; }
        .stat-pill strong { font-size: 16px; font-weight: 800; color: var(--accent-light); }
        .update-badge { display: flex; align-items: center; gap: 6px; padding: 6px 14px; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); border-radius: 20px; font-size: 12px; color: var(--tag-life); }
        .update-badge .dot { width: 8px; height: 8px; background: var(--tag-life); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px; padding: 32px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: all 0.3s; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 12px 32px var(--shadow); }
        .card-top { padding: 20px 20px 16px; display: flex; align-items: flex-start; gap: 16px; }
        .avatar { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex-shrink: 0; position: relative; border: 3px solid var(--border); background: var(--bg); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .avatar::after { content: ''; position: absolute; bottom: -2px; right: -2px; width: 16px; height: 16px; background: #10b981; border: 3px solid var(--bg-card); border-radius: 50%; }
        .card-top-info { flex: 1; min-width: 0; }
        .card-top-info h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .card-top-info .email { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .card-top-info .email svg { width: 13px; height: 13px; flex-shrink: 0; }
        .followers { text-align: right; flex-shrink: 0; }
        .followers .num { font-size: 24px; font-weight: 800; color: var(--accent-light); }
        .followers .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .tags-row { padding: 0 20px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .tag svg { width: 12px; height: 12px; }
        .tag-life { background: rgba(16,185,129,0.15); color: var(--tag-life); }
        .tag-fashion { background: rgba(236,72,153,0.15); color: var(--tag-fashion); }
        .tag-beauty { background: rgba(168,85,247,0.15); color: var(--tag-beauty); }
        .tag-business { background: rgba(245,158,11,0.15); color: var(--tag-business); }
        .video-section { margin: 0 20px 16px; border-radius: 12px; overflow: hidden; position: relative; background: var(--bg); border: 1px solid var(--border); }
        .video-section a { display: block; text-decoration: none; color: var(--text); }
        .video-thumb { width: 100%; aspect-ratio: 16/9; position: relative; overflow: hidden; background: #000; }
        .video-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s, filter 0.3s; }
        .video-section:hover .video-thumb img { transform: scale(1.05); filter: brightness(0.7); }
        .play-button { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; background: rgba(99,102,241,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1; transition: all 0.3s; box-shadow: 0 4px 20px rgba(99,102,241,0.5); }
        .video-section:hover .play-button { background: var(--accent-pink); transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 4px 24px rgba(236,72,153,0.6); }
        .play-button svg { width: 28px; height: 28px; color: white; margin-left: 3px; }
        .video-info-bar { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); border-top: 1px solid var(--border); }
        .video-info-bar .v-label { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .video-info-bar .v-label svg { width: 14px; height: 14px; color: var(--accent-pink); }
        .video-info-bar .v-open { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; transition: color 0.2s; }
        .video-section:hover .v-open { color: var(--accent-light); }
        .video-info-bar .v-open svg { width: 12px; height: 12px; }
        .actions { padding: 0 20px 16px; display: flex; gap: 10px; }
        .btn-link { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; text-decoration: none; transition: all 0.2s; cursor: pointer; border: none; }
        .btn-link svg { width: 16px; height: 16px; }
        .btn-home { background: var(--accent); color: white; }
        .btn-home:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,0.4); }
        .btn-email { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-email:hover { background: var(--bg-card-hover); border-color: var(--accent); }
        .pricing { margin: 0 20px 16px; padding: 16px; background: var(--bg); border-radius: 12px; border: 1px solid var(--border); }
        .pricing-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .pricing-title svg { width: 14px; height: 14px; }
        .price-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 13px; }
        .price-item:not(:last-child) { border-bottom: 1px solid var(--border); }
        .price-item .p-label { color: var(--text-muted); }
        .price-item .p-value { font-weight: 700; color: var(--tag-life); }
        .notes { margin: 0 20px 16px; padding: 12px 16px; background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.3); border-radius: 10px; font-size: 13px; display: flex; align-items: flex-start; gap: 8px; }
        .notes svg { width: 16px; height: 16px; color: var(--tag-business); flex-shrink: 0; margin-top: 1px; }
        .notes span { color: var(--text); line-height: 1.5; }
        .no-pricing { margin: 0 20px 16px; padding: 14px 16px; background: rgba(100,116,139,0.08); border: 1px dashed var(--border); border-radius: 10px; font-size: 13px; color: var(--text-muted); text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .no-pricing svg { width: 14px; height: 14px; }
        .footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--border); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        @media (max-width: 768px) { .header { padding: 12px 16px; flex-direction: column; gap: 12px; } .board { padding: 16px; grid-template-columns: 1fr; } }
    </style>
</head>
